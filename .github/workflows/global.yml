name: Global Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build OpenMail
        run: mvn clean package

      - name: Upload OpenMail JAR
        uses: actions/upload-artifact@v4
        with:
          name: OpenMail
          path: src/target/*.jar
